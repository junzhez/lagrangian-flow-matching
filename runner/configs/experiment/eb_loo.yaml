# @package _global_

defaults:
  - override /model: otcfm.yaml
  - override /logger:
      - csv.yaml
      - wandb.yaml
  - override /datamodule: eb_loo.yaml

name: "eb_loo"
seed: 42

datamodule:
  batch_size: 128

model:
  optimizer:
    lr: 0.001
    weight_decay: 1e-5
  sigma_min: 0.1
  leaveout_timepoint: -1   # override at CLI: model.leaveout_timepoint=2

trainer:
  max_epochs: 1000
  check_val_every_n_epoch: 50
